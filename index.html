<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 1인 1역할 배정판</title>
  <!-- 교실용 동글동글 시인성 폰트 (Jua & Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    /* 🎨 [3] 파스텔 민트 & 코랄 테마 시스템 */
    :root {
      --bg-mint: #eef8f5;
      --board-mint: #ffffff;
      --primary-coral: #ff7556;
      --primary-coral-dark: #eb5e3e;
      --secondary-mint: #2ec4b6;
      --secondary-mint-dark: #20a39e;
      --mint-light: #d8f3dc;
      --coral-light: #ffe8e2;
      --coral-border: #ffd3c8;
      --mint-border: #bceadc;
      --text-main: #2b3a42;
      --text-sub: #5f747e;
      --shadow-soft: 0 10px 24px rgba(46, 196, 182, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-mint);
      color: var(--text-main);
      padding: 24px 16px 60px 16px;
      min-height: 100vh;
      background-image: 
        radial-gradient(#cbebe2 1.5px, transparent 1.5px),
        radial-gradient(#ffdcd3 1.5px, transparent 1.5px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 🎊 [4] 꽃가루 캔버스 레이어 */
    #confettiCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99999;
    }

    /* 상단 헤더 */
    header {
      text-align: center;
      margin-bottom: 24px;
      position: relative;
    }

    h1 {
      font-family: 'Jua', sans-serif;
      font-size: 2.9rem;
      color: var(--primary-coral-dark);
      text-shadow: 2px 2px 0px #ffffff;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 1.2rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    /* 상단 툴바 버튼 (TV 전체화면, 인쇄) */
    .top-toolbar {
      position: absolute;
      right: 0;
      top: 10px;
      display: flex;
      gap: 8px;
    }

    .tool-btn {
      background: #ffffff;
      border: 2px solid var(--mint-border);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 700;
      color: var(--secondary-mint-dark);
      transition: all 0.2s ease;
      box-shadow: 0 3px 8px rgba(0,0,0,0.04);
    }

    .tool-btn:hover {
      background: var(--secondary-mint);
      color: #ffffff;
      border-color: var(--secondary-mint);
    }

    /* 입력 영역 */
    .input-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .input-card {
      background: var(--board-mint);
      border-radius: 22px;
      padding: 22px;
      box-shadow: var(--shadow-soft);
      border: 3px solid var(--mint-border);
      display: flex;
      flex-direction: column;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-header h2 {
      font-family: 'Jua', sans-serif;
      font-size: 1.55rem;
      color: var(--secondary-mint-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .count-badge {
      background: var(--mint-light);
      color: var(--secondary-mint-dark);
      font-size: 0.95rem;
      padding: 4px 12px;
      border-radius: 14px;
      font-weight: 800;
    }

    textarea {
      width: 100%;
      height: 160px;
      padding: 14px;
      border: 2px solid #e1efe9;
      border-radius: 14px;
      font-size: 1.15rem;
      font-family: inherit;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      background-color: #fafffe;
    }

    textarea:focus {
      border-color: var(--secondary-mint);
      background-color: #ffffff;
    }

    /* 📌 [2] 사전 고정 핀 패널 */
    .pin-panel {
      background: #ffffff;
      border-radius: 22px;
      border: 3px dashed var(--coral-border);
      padding: 20px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-soft);
    }

    .pin-title {
      font-family: 'Jua', sans-serif;
      font-size: 1.35rem;
      color: var(--primary-coral);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pin-title span {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-sub);
    }

    .pin-form {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .pin-select {
      flex: 1;
      min-width: 180px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 2px solid var(--mint-border);
      font-size: 1.05rem;
      font-family: inherit;
      background: #ffffff;
      outline: none;
    }

    .pin-btn {
      background: var(--primary-coral);
      color: #fff;
      font-family: 'Jua', sans-serif;
      font-size: 1.15rem;
      border: none;
      padding: 10px 22px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .pin-btn:hover {
      background: var(--primary-coral-dark);
    }

    .pinned-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pinned-tag {
      background: var(--coral-light);
      border: 1px solid var(--coral-border);
      color: var(--primary-coral-dark);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .pinned-tag-del {
      cursor: pointer;
      font-weight: bold;
      color: #ff3b3b;
      margin-left: 4px;
    }

    /* 🎰 [1] 중앙 실행 버튼 */
    .action-area {
      text-align: center;
      margin: 15px 0 35px 0;
    }

    .btn-shuffle {
      font-family: 'Jua', sans-serif;
      font-size: 2rem;
      padding: 18px 56px;
      background: linear-gradient(135deg, var(--primary-coral) 0%, #ff8e72 100%);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 12px 25px rgba(255, 117, 86, 0.35);
      transition: all 0.2s ease;
      letter-spacing: 1px;
    }

    .btn-shuffle:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 16px 30px rgba(255, 117, 86, 0.45);
    }

    .btn-shuffle:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn-shuffle:disabled {
      background: #b2bec3;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    /* 결과 카드 영역 */
    .result-section {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 26px;
      padding: 28px;
      border: 2px dashed var(--secondary-mint);
      box-shadow: var(--shadow-soft);
    }

    .result-title {
      font-family: 'Jua', sans-serif;
      font-size: 2rem;
      text-align: center;
      margin-bottom: 24px;
      color: var(--secondary-mint-dark);
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    /* 개별 역할 카드 */
    .match-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.04);
      border: 2px solid var(--mint-border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .match-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(46, 196, 182, 0.15);
    }

    /* 슬롯머신 두구두구 회전 중일 때 카드 애니메이션 */
    .match-card.shuffling {
      animation: slotFlicker 0.1s infinite alternate;
      border-color: var(--primary-coral);
    }

    @keyframes slotFlicker {
      0% { transform: translateY(-2px); opacity: 0.85; }
      100% { transform: translateY(2px); opacity: 1; }
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 8px;
      font-weight: 800;
    }

    .badge-pinned {
      background: var(--coral-light);
      color: var(--primary-coral-dark);
      border: 1px solid var(--coral-border);
    }

    .badge-random {
      background: var(--mint-light);
      color: var(--secondary-mint-dark);
    }

    .role-name {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-main);
      word-break: keep-all;
      line-height: 1.4;
      min-height: 2.8rem;
      display: flex;
      align-items: center;
    }

    .student-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px dashed #e8f5f1;
      padding-top: 12px;
    }

    .student-label {
      font-size: 1rem;
      color: var(--text-sub);
      font-weight: 700;
    }

    .student-name {
      font-family: 'Jua', sans-serif;
      font-size: 1.65rem;
      color: var(--primary-coral-dark);
      background: var(--coral-light);
      padding: 2px 14px;
      border-radius: 12px;
      min-width: 90px;
      text-align: center;
      transition: all 0.1s;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #9cb3ad;
      font-size: 1.4rem;
      font-family: 'Jua', sans-serif;
    }

    /* 🖨️ [3] A4 인쇄 전용 스타일 */
    .print-header {
      display: none;
    }

    @media print {
      body {
        background: #ffffff !important;
        background-image: none !important;
        padding: 0;
        margin: 0;
        color: #000;
      }
      .no-print, header, .input-section, .pin-panel, .action-area, #confettiCanvas {
        display: none !important;
      }
      .container {
        max-width: 100% !important;
        width: 100% !important;
      }
      .result-section {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        background: transparent !important;
      }
      .print-header {
        display: block !important;
        text-align: center;
        margin-bottom: 25px;
        border-bottom: 2px solid #333;
        padding-bottom: 15px;
      }
      .print-header h1 {
        font-size: 2.2rem;
        color: #000 !important;
        text-shadow: none !important;
      }
      .print-header p {
        font-size: 1rem;
        color: #555;
      }
      .result-title {
        display: none;
      }
      .result-grid {
        grid-template-columns: repeat(3, 1fr) !important;
        gap: 12px !important;
      }
      .match-card {
        border: 1.5px solid #444 !important;
        box-shadow: none !important;
        page-break-inside: avoid;
        break-inside: avoid;
        padding: 12px !important;
      }
      .student-name {
        color: #000 !important;
        background: #eee !important;
      }
    }

    @media (max-width: 768px) {
      .input-section { grid-template-columns: 1fr; }
      h1 { font-size: 2.2rem; }
      .top-toolbar { position: static; justify-content: center; margin-top: 10px; }
      .btn-shuffle { font-size: 1.6rem; padding: 14px 36px; }
    }
  </style>
</head>
<body>

  <!-- 꽃가루 캔버스 -->
  <canvas id="confettiCanvas"></canvas>

  <div class="container">
    
    <!-- 인쇄용 타이틀 (화면에는 안 보이고 출력 시에만 나타남) -->
    <div class="print-header">
      <h1>🌱 우리 반 1인 1역할 배정표</h1>
      <p id="printDate"></p>
    </div>

    <!-- 웹 브라우저 헤더 -->
    <header class="no-print">
      <h1>🌱 우리 반 1인 1역할 배정판</h1>
      <p class="subtitle">모두가 주인이 되어 가꾸는 행복한 우리 반 ✨</p>
      <div class="top-toolbar">
        <button class="tool-btn" onclick="printPage()">🖨️ A4 출력하기</button>
        <button class="tool-btn" onclick="toggleFullScreen()">🖥️ TV 전체화면</button>
      </div>
    </header>

    <!-- 입력 섹션 -->
    <div class="input-section no-print">
      <!-- 1. 학생 명단 -->
      <div class="input-card">
        <div class="card-header">
          <h2>🧑‍🤝‍🧑 학생 명단</h2>
          <span class="count-badge" id="studentCount">10명</span>
        </div>
        <textarea id="studentInput" placeholder="학생 이름을 줄바꿈(엔터)으로 입력하세요." oninput="handleInputsChanged()">김민준
이서아
박도윤
최지우
정예준
강하은
조시우
윤서연
장은우
한지민</textarea>
      </div>

      <!-- 2. 역할 목록 -->
      <div class="input-card">
        <div class="card-header">
          <h2>📋 1인 1역할 목록</h2>
          <span class="count-badge" id="roleCount">10개</span>
        </div>
        <textarea id="roleInput" placeholder="역할 이름을 줄바꿈(엔터)으로 입력하세요." oninput="handleInputsChanged()">칠판 지우기
우유 급식 도우미
분리수거 및 쓰레기통
창문 환기 및 커튼
교실 바닥 쓸기
학습지 배부 도우미
에너지 지킴이 (소등)
도서 코너 정리
컴퓨터 및 TV 관리
줄서기 반장</textarea>
      </div>
    </div>

    <!-- 📌 [2] 사전 고정 핀 영역 -->
    <div class="pin-panel no-print">
      <div class="pin-title">
        📌 사전 고정 핀 설정 
        <span>(특정 학생에게 역할을 미리 고정해 두고 나머지만 랜덤으로 돌릴 수 있습니다)</span>
      </div>
      <div class="pin-form">
        <select id="pinStudentSelect" class="pin-select">
          <option value="">학생을 선택하세요</option>
        </select>
        <select id="pinRoleSelect" class="pin-select">
          <option value="">역할을 선택하세요</option>
        </select>
        <button class="pin-btn" onclick="addPin()">📌 고정 추가</button>
      </div>
      <div class="pinned-tags" id="pinnedTagsContainer">
        <!-- 등록된 고정 핀 칩들이 표시됨 -->
      </div>
    </div>

    <!-- 중앙 실행 버튼 -->
    <div class="action-area no-print">
      <button id="shuffleBtn" class="btn-shuffle" onclick="startAssignProcess()">🎲 역할 랜덤 배정하기</button>
    </div>

    <!-- 결과 카드 그리드 -->
    <div class="result-section">
      <h2 class="result-title">✨ 오늘의 역할 배정 결과 ✨</h2>
      <div class="result-grid" id="resultGrid">
        <div class="empty-state">
          상단의 [🎲 역할 랜덤 배정하기] 버튼을 누르면 배정이 시작됩니다!
        </div>
      </div>
    </div>

  </div>

  <script>
    // 상태 변수
    let pinnedPairs = []; // [{ student: '이름', role: '역할' }]
    let isShuffling = false;

    // 문자열 파싱 (빈 줄 제거)
    function parseLines(text) {
      return text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
    }

    // 인원 및 역할 카운터 & 드롭다운 갱신
    function handleInputsChanged() {
      const students = parseLines(document.getElementById('studentInput').value);
      const roles = parseLines(document.getElementById('roleInput').value);

      document.getElementById('studentCount').textContent = `${students.length}명`;
      document.getElementById('roleCount').textContent = `${roles.length}개`;

      // 목록에서 사라진 고정 핀 제거
      pinnedPairs = pinnedPairs.filter(p => students.includes(p.student) && roles.includes(p.role));
      renderPinnedTags();
      updatePinDropdowns(students, roles);
    }

    // 📌 고정 드롭다운 옵션 갱신
    function updatePinDropdowns(students, roles) {
      const sSelect = document.getElementById('pinStudentSelect');
      const rSelect = document.getElementById('pinRoleSelect');

      const pinnedStudents = pinnedPairs.map(p => p.student);
      const pinnedRoles = pinnedPairs.map(p => p.role);

      sSelect.innerHTML = '<option value="">학생 선택</option>';
      students.forEach(s => {
        if (!pinnedStudents.includes(s)) {
          sSelect.innerHTML += `<option value="${s}">${s}</option>`;
        }
      });

      rSelect.innerHTML = '<option value="">역할 선택</option>';
      roles.forEach(r => {
        if (!pinnedRoles.includes(r)) {
          rSelect.innerHTML += `<option value="${r}">${r}</option>`;
        }
      });
    }

    // 📌 고정 추가
    function addPin() {
      const s = document.getElementById('pinStudentSelect').value;
      const r = document.getElementById('pinRoleSelect').value;

      if (!s || !r) {
        alert('고정할 학생과 역할을 모두 선택해 주세요!');
        return;
      }

      pinnedPairs.push({ student: s, role: r });
      handleInputsChanged();
    }

    // 📌 고정 해제
    function removePin(index) {
      pinnedPairs.splice(index, 1);
      handleInputsChanged();
    }

    // 📌 고정 태그 UI 렌더링
    function renderPinnedTags() {
      const container = document.getElementById('pinnedTagsContainer');
      container.innerHTML = '';
      pinnedPairs.forEach((pair, idx) => {
        const tag = document.createElement('span');
        tag.className = 'pinned-tag';
        tag.innerHTML = `📌 <b>${pair.student}</b> ➔ ${pair.role} <span class="pinned-tag-del" onclick="removePin(${idx})" title="고정 취소">✕</span>`;
        container.appendChild(tag);
      });
    }

    // Fisher-Yates 셔플 알고리즘
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 🎰 [1] 2초 슬롯머신 애니메이션 & 배정 프로세스
    function startAssignProcess() {
      if (isShuffling) return;

      const students = parseLines(document.getElementById('studentInput').value);
      const roles = parseLines(document.getElementById('roleInput').value);

      if (students.length === 0 || roles.length === 0) {
        alert('학생 명단과 역할 목록을 1개 이상 입력해 주세요!');
        return;
      }

      // 1. 고정된 학생/역할 분리
      const pinnedStudents = pinnedPairs.map(p => p.student);
      const pinnedRoles = pinnedPairs.map(p => p.role);

      const remainStudents = students.filter(s => !pinnedStudents.includes(s));
      const remainRoles = roles.filter(r => !pinnedRoles.includes(r));

      // 2. 최종 결과 미리 산출
      const shuffledStudents = shuffleArray(remainStudents);
      const shuffledRoles = shuffleArray(remainRoles);

      const totalSlots = pinnedPairs.length + Math.max(shuffledStudents.length, shuffledRoles.length);
      const finalMatches = [...pinnedPairs.map(p => ({ student: p.student, role: p.role, isPinned: true }))];

      const maxRemaining = Math.max(shuffledStudents.length, shuffledRoles.length);
      for (let i = 0; i < maxRemaining; i++) {
        finalMatches.push({
          student: shuffledStudents[i] || '공석 (없음)',
          role: shuffledRoles[i] || '자유 / 도우미',
          isPinned: false
        });
      }

      // 3. UI 잠금 및 슬롯머신 두구두구 회전 시작
      isShuffling = true;
      const btn = document.getElementById('shuffleBtn');
      btn.disabled = true;
      btn.textContent = '🥁 두구두구... 배정 중!';

      const grid = document.getElementById('resultGrid');
      grid.innerHTML = '';

      // 슬롯 회전용 임시 카드 생성
      const tempCards = [];
      for (let i = 0; i < totalSlots; i++) {
        const card = document.createElement('div');
        card.className = 'match-card shuffling';
        card.innerHTML = `
          <div class="card-top">
            <span class="badge ${finalMatches[i].isPinned ? 'badge-pinned' : 'badge-random'}">
              ${finalMatches[i].isPinned ? '📌 고정' : '🎲 셔플 중...'}
            </span>
          </div>
          <div class="role-name">${finalMatches[i].isPinned ? finalMatches[i].role : '???'}</div>
          <div class="student-row">
            <span class="student-label">담당:</span>
            <span class="student-name">${finalMatches[i].isPinned ? finalMatches[i].student : '???'}</span>
          </div>
        `;
        grid.appendChild(card);
        tempCards.push(card);
      }

      // 2초 동안 70ms마다 이름/역할이 마구 바뀌는 슬롯머신 효과
      const rollInterval = setInterval(() => {
        tempCards.forEach((card, idx) => {
          if (!finalMatches[idx].isPinned) {
            const randomStudent = remainStudents[Math.floor(Math.random() * remainStudents.length)] || '???';
            const randomRole = remainRoles[Math.floor(Math.random() * remainRoles.length)] || '???';
            card.querySelector('.role-name').textContent = randomRole;
            card.querySelector('.student-name').textContent = randomStudent;
          }
        });
      }, 70);

      // 2초(2000ms) 후 최종 결과 확정!
      setTimeout(() => {
        clearInterval(rollInterval);
        isShuffling = false;
        btn.disabled = false;
        btn.textContent = '🎲 역할 다시 배정하기';

        // 최종 카드 렌더링
        grid.innerHTML = '';
        finalMatches.forEach((match) => {
          const card = document.createElement('div');
          card.className = 'match-card';
          card.innerHTML = `
            <div class="card-top">
              <span class="badge ${match.isPinned ? 'badge-pinned' : 'badge-random'}">
                ${match.isPinned ? '📌 고정 배정' : '🎲 랜덤 배정'}
              </span>
            </div>
            <div class="role-name">${match.role}</div>
            <div class="student-row">
              <span class="student-label">담당:</span>
              <span class="student-name">${match.student}</span>
            </div>
          `;
          grid.appendChild(card);
        });

        // 🎊 [4] 축하 꽃가루 발사!
        fireConfetti();
      }, 2000);
    }

    // 🎊 [4] 자체 캔버스 꽃가루(Confetti) 폭죽 엔진 (외부 라이브러리 無)
    function fireConfetti() {
      const canvas = document.getElementById('confettiCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const confettiPieces = [];
      const colors = ['#ff7556', '#2ec4b6', '#ffd166', '#ff9f43', '#54a0ff', '#1dd1a1', '#ff6b81'];

      for (let i = 0; i < 150; i++) {
        confettiPieces.push({
          x: window.innerWidth / 2 + (Math.random() - 0.5) * 400,
          y: window.innerHeight * 0.45 + (Math.random() - 0.5) * 150,
          w: Math.random() * 10 + 6,
          h: Math.random() * 8 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 18,
          vy: Math.random() * -14 - 6,
          gravity: 0.38,
          rotation: Math.random() * 360,
          rotationSpeed: (Math.random() - 0.5) * 10,
          opacity: 1
        });
      }

      const startTime = Date.now();
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let hasAlive = false;

        confettiPieces.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.rotation += p.rotationSpeed;
          p.opacity -= 0.0075;

          if (p.opacity > 0) {
            hasAlive = true;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.globalAlpha = Math.max(0, p.opacity);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
          }
        });

        if (hasAlive && Date.now() - startTime < 3500) {
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      animate();
    }

    // 🖨️ [3] A4 인쇄 기능
    function printPage() {
      const now = new Date();
      const dateStr = `배정 일자: ${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일`;
      document.getElementById('printDate').textContent = dateStr;
      window.print();
    }

    // 🖥️ 교실 TV 전체화면 모드 토글
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          alert(`전체화면 전환에 실패했습니다: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // 창 크기 변경 시 캔버스 반응형 리사이즈
    window.addEventListener('resize', () => {
      const canvas = document.getElementById('confettiCanvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // 시작 시 초기화
    handleInputsChanged();
  </script>
</body>
